document:
  page_start: 1
  page_end: null
  render_dpi: 180
docling:
  do_ocr: false
  do_table_structure: true
  do_formula_enrichment: true
page1:
  abstract_aliases: [Abstract, Summary]
headers:
  enabled: true
figures:
  complete_caption_anchored: true
  max_completion_area_multiplier: 4.0
  max_completion_page_area_ratio: 0.65
  max_completion_edge_growth_ratio: 0.45
  completion_paragraph_min_chars: 80
  completion_min_assignment_score: 7.0
footer:
  enabled: true
tail:
  enabled: true
table_context:
  enabled: true
  max_vertical_gap_page_ratio: 0.10
  min_horizontal_overlap_ratio: 0.18
  acceptance_score: 4.5
  ambiguity_margin: 0.6
  max_boundary_overlap_page_ratio: 0.008
  # Caption continuations are linked to a strong caption seed, never inferred
  # from table proximity alone. Gap checks combine page and local line scales.
  fragment_max_gap_page_ratio: 0.018
  fragment_max_line_gap_ratio: 1.8
  fragment_min_horizontal_overlap: 0.30
  fragment_edge_alignment_page_ratio: 0.025
  fragment_acceptance_score: 4.5
  fragment_ambiguity_margin: 0.75
caption_overlap:
  enabled: true
  # Conservative defaults: only near-identical boxes are collapsed.
  duplicate_iou: 0.90
  duplicate_edge_page_ratio: 0.003
  duplicate_area_ratio: 0.85
  nested_containment: 0.92
  fragment_max_gap_page_ratio: 0.012
  boundary_overlap_page_ratio: 0.008
  boundary_overlap_ratio: 0.20
caption_association:
  enabled: true
  max_vertical_gap_page_ratio: 0.10
  min_horizontal_overlap_ratio: 0.18
  blocker_horizontal_overlap_ratio: 0.25
  acceptance_score: 0.35
  ambiguity_margin: 0.15
overlap_resolution:
  enabled: true
  # Destructive canonicalization is deliberately high precision. Calibrate
  # these publisher-independent defaults against a stratified document corpus.
  duplicate_iou: 0.90
  duplicate_edge_page_ratio: 0.003
  duplicate_area_ratio: 0.85
  fragment_horizontal_overlap: 0.50
  fragment_max_gap_page_ratio: 0.012
  boundary_overlap_ratio: 0.20
  preserve_authoritative_nested_regions: true
containment:
  strong_child_coverage: 0.92
  center_child_coverage: 0.72
  max_child_parent_area_ratio: 0.85
  panel_label_max_chars: 12
  body_paragraph_min_chars: 80
  caption_identifier_max_chars: 24
heuristics:
  # Publisher terms are data-only evidence and cannot delete content without
  # corroborating generic geometry/structure in confirmatory mode.
  publisher_profiles: [elsevier_sciencedirect, generic_academic_publishers]
  publisher_mode: confirmatory
  document_family: auto
  language: auto
content_policy:
  retain_front_matter: false
  retain_references: false
  retain_acknowledgements: false
  retain_declarations: false
  retain_appendices: false
  retain_supplementary_sections: false
  preserve_excluded_sections_in_secondary_stream: true
