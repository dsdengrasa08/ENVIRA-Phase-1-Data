document:
  page_start: 1
  page_end: null
  render_dpi: 180
docling:
  do_ocr: false
  do_table_structure: true
  do_formula_enrichment: true
page1:
  abstract_aliases: [Abstract, Summary]
headers:
  enabled: true
figures:
  complete_caption_anchored: true
footer:
  enabled: true
tail:
  enabled: true
table_context:
  enabled: true
  max_vertical_gap_page_ratio: 0.10
  min_horizontal_overlap_ratio: 0.18
  acceptance_score: 4.5
  ambiguity_margin: 0.6
  max_boundary_overlap_page_ratio: 0.008
  # Caption continuations are linked to a strong caption seed, never inferred
  # from table proximity alone. Gap checks combine page and local line scales.
  fragment_max_gap_page_ratio: 0.018
  fragment_max_line_gap_ratio: 1.8
  fragment_min_horizontal_overlap: 0.30
  fragment_edge_alignment_page_ratio: 0.025
  fragment_acceptance_score: 4.5
  fragment_ambiguity_margin: 0.75
caption_overlap:
  enabled: true
  # Conservative defaults: only near-identical boxes are collapsed.
  duplicate_iou: 0.90
  duplicate_edge_page_ratio: 0.003
  duplicate_area_ratio: 0.85
  nested_containment: 0.92
  fragment_max_gap_page_ratio: 0.012
  boundary_overlap_page_ratio: 0.008
  boundary_overlap_ratio: 0.20
overlap_resolution:
  enabled: true
  # Destructive canonicalization is deliberately high precision. Calibrate
  # these publisher-independent defaults against a stratified document corpus.
  duplicate_iou: 0.90
  duplicate_edge_page_ratio: 0.003
  duplicate_area_ratio: 0.85
  nested_containment: 0.92
  fragment_horizontal_overlap: 0.50
  fragment_max_gap_page_ratio: 0.012
  boundary_overlap_ratio: 0.20
  preserve_authoritative_nested_regions: true
caption_validation:
  enabled: true
  # A line-start anchor only proposes a boundary; parent geometry confirms it.
  split_acceptance_score: 6.0
  split_margin: 1.5
  review_score: 4.0
  max_parent_gap_page_ratio: 0.12
  min_parent_horizontal_overlap: 0.18
  use_pdf_text_lines: true
