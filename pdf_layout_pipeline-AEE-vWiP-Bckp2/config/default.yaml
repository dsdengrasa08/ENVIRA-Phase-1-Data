document:
  page_start: 1
  page_end: null
  render_dpi: 180
docling:
  do_ocr: false
  do_table_structure: true
  do_formula_enrichment: true
  require_model_manifest: true
  # One-time trust-on-first-use migration for pre-manifest Colab model caches.
  bootstrap_legacy_model_manifest: true
  model_download_timeout_seconds: 900
operational:
  total_run_timeout_seconds: null
  minimum_free_disk_bytes: 1000000000
  retain_private_traceback: false
page1:
  abstract_aliases: [Abstract, Summary]
  role_classification_enabled: true
  role_min_confidence: 0.78
  role_cluster_max_vertical_gap: 0.035
  role_cluster_min_horizontal_overlap: 0.45
  role_max_candidate_words: 120
  # Infer publisher-independent metadata containers/fields before role filtering.
  # Every merge requires a populated field, spatial continuity, and no intervening
  # semantic boundary; ambiguous detector regions remain unchanged.
  metadata_structure_enabled: true
  metadata_container_min_fields: 2
  metadata_heading_max_words: 10
  metadata_heading_max_vertical_gap: 0.025
  metadata_value_min_vertical_gap: 0.008
  metadata_value_max_vertical_gap: 0.035
  metadata_min_horizontal_overlap: 0.35
  metadata_max_left_alignment_delta: 0.025
headers:
  enabled: true
  roi_ocr_fallback: true
  roi_ocr_dpi: 300
  roi_ocr_language: eng
  roi_ocr_cache: true
  roi_ocr_disable_after_failure: true
figures:
  complete_caption_anchored: true
  max_completion_area_multiplier: 4.0
  max_completion_page_area_ratio: 0.65
  max_completion_edge_growth_ratio: 0.45
  completion_paragraph_min_chars: 80
  completion_min_assignment_score: 7.0
  # Conservative decomposition requires distinct caption identities, stable visual
  # components, and an unambiguous caption/component assignment.
  decompose_oversized: true
  decomposition_min_caption_identities: 2
  decomposition_min_component_area_ratio: 0.025
  decomposition_max_foreground_bridge_ratio: 0.08
  decomposition_min_assignment_margin: 0.08
  decomposition_padding_page_ratio: 0.002
  # Boundary refinement is conflict-driven. A whitespace valley is never sufficient
  # without competing geometry; outward completion also requires visual support.
  refine_boundaries: true
  refinement_ink_threshold: 246
  refinement_min_component_area_ratio: 0.00005
  refinement_min_conflict_smaller_ratio: 0.08
  refinement_min_penetration_page_ratio: 0.004
  refinement_max_neighbor_gap_page_ratio: 0.002
  refinement_min_cross_axis_overlap_ratio: 0.25
  refinement_max_valley_density: 0.015
  refinement_min_valley_page_ratio: 0.003
  refinement_max_removed_ink_ratio: 0.015
  refinement_min_added_ink_ratio: 0.002
  refinement_max_edge_expansion_page_ratio: 0.08
  refinement_protection_padding_page_ratio: 0.002
footer:
  enabled: true
tail:
  enabled: true
table_context:
  enabled: true
  max_vertical_gap_page_ratio: 0.10
  min_horizontal_overlap_ratio: 0.18
  acceptance_score: 4.5
  ambiguity_margin: 0.6
  max_boundary_overlap_page_ratio: 0.008
  # Caption continuations are linked to a strong caption seed, never inferred
  # from table proximity alone. Gap checks combine page and local line scales.
  fragment_max_gap_page_ratio: 0.018
  fragment_max_line_gap_ratio: 1.8
  fragment_min_horizontal_overlap: 0.30
  fragment_edge_alignment_page_ratio: 0.025
  fragment_acceptance_score: 4.5
  fragment_ambiguity_margin: 0.75
caption_overlap:
  enabled: true
  # Conservative defaults: only near-identical boxes are collapsed.
  duplicate_iou: 0.90
  duplicate_edge_page_ratio: 0.003
  duplicate_area_ratio: 0.85
  nested_containment: 0.92
  fragment_max_gap_page_ratio: 0.012
  boundary_overlap_page_ratio: 0.008
  boundary_overlap_ratio: 0.20
caption_association:
  enabled: true
  max_vertical_gap_page_ratio: 0.10
  min_horizontal_overlap_ratio: 0.18
  blocker_horizontal_overlap_ratio: 0.25
  acceptance_score: 0.35
  ambiguity_margin: 0.15
overlap_resolution:
  enabled: true
  # Destructive canonicalization is deliberately high precision. Calibrate
  # these publisher-independent defaults against a stratified document corpus.
  duplicate_iou: 0.90
  duplicate_edge_page_ratio: 0.003
  duplicate_area_ratio: 0.85
  fragment_horizontal_overlap: 0.50
  fragment_max_gap_page_ratio: 0.012
  boundary_overlap_ratio: 0.20
  preserve_authoritative_nested_regions: true
  # Formula/Text conflicts are resolved only when asymmetric coverage, block
  # geometry, and valid residual Text regions agree. Ambiguous/inline cases are
  # retained unchanged and remain visible in relationship diagnostics.
  resolve_formula_text_conflicts: true
  formula_min_coverage: 0.55
  formula_min_horizontal_coverage: 0.45
  formula_block_min_width_page_ratio: 0.08
  formula_inline_max_height_page_ratio: 0.018
  formula_boundary_band_ratio: 0.35
  formula_split_min_fragment_height_page_ratio: 0.006
  formula_split_min_fragment_area_page_ratio: 0.0002
  formula_protection_padding_page_ratio: 0.001
  formula_boundary_min_retained_height_ratio: 0.45
  cross_class_min_survivor_score: 0.80
  cross_class_score_margin: 0.20
equation_crops:
  # Downstream crop margin only; physical and reading-order geometry is unchanged.
  enabled: true
  vertical_margin_height_ratio: 0.30
  # Avoid a self-reinforcing tiny margin for unusually short detector boxes.
  minimum_vertical_margin_page_ratio: 0.006
  minimum_clearance_height_ratio: 0.12
  maximum_margin_page_ratio: 0.018
  neighbor_corridor_overlap_ratio: 0.20
  equation_number_max_gap_page_ratio: 0.20
  ink_threshold: 235
  minimum_ink_pixels: 3
containment:
  strong_child_coverage: 0.92
  center_child_coverage: 0.72
  # Near-containment is admitted only for a centered child with a small, measured
  # edge protrusion. It is not a general expansion margin around every Figure.
  near_child_coverage: 0.82
  near_max_edge_protrusion_page_ratio: 0.004
  max_child_parent_area_ratio: 0.85
  trusted_figure_max_page_area_ratio: 0.65
  panel_label_max_chars: 12
  body_paragraph_min_chars: 80
  caption_identifier_max_chars: 24
error_policy:
  mode: strict
  page_failure: continue
  stage_failure: stop
  export_partial_results: true
  max_failed_pages: 3
  max_failed_page_ratio: 0.10
core:
  # `extracted` currently uses the typed strangler adapter; use shadow_compare
  # during migration to publish semantic differences against the frozen core.
  implementation: preserved
  compare_with_preserved: false
  fail_on_difference: true
security:
  max_input_pdf_bytes: 250000000
  max_page_count: 2000
  max_artifact_bytes: 500000000
  max_total_artifact_bytes: 2000000000
  max_jsonl_line_bytes: 8000000
  max_jsonl_rows: 2000000
  max_validation_errors: 1000
  allow_symlink_artifacts: false
  allow_remote_services: false
  secure_file_mode: 384  # 0o600
  secure_directory_mode: 448  # 0o700
privacy:
  export_raw_document: false
  export_raw_markdown: false
  export_region_text: true
  export_source_paths: false
  redact_effective_config: true
  diagnostics_detail: standard
  retain_failed_artifacts: false
heuristics:
  # Publisher terms are data-only evidence and cannot delete content without
  # corroborating generic geometry/structure in confirmatory mode.
  publisher_profiles: [elsevier_sciencedirect, generic_academic_publishers]
  publisher_mode: confirmatory
  document_family: auto
  language: auto
content_policy:
  retain_front_matter: false
  retain_references: false
  retain_acknowledgements: false
  retain_declarations: false
  retain_appendices: false
  retain_supplementary_sections: false
  preserve_excluded_sections_in_secondary_stream: true
