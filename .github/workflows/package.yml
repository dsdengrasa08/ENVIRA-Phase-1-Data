name: package

on:
  pull_request:
  push:
    tags: ["envira-pdf-layout-v*"]

permissions:
  contents: read

jobs:
  source-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf_layout_pipeline-AEE-vWiP
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --constraint constraints-regression.txt ".[test]"
      - run: python -m pip check
      - run: pytest -q
      - run: pytest -q -m regression

  distribution:
    needs: source-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf_layout_pipeline-AEE-vWiP
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --constraint constraints-regression.txt build twine pip-audit cyclonedx-bom
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/inspect_distribution.py dist/*
      - run: python -m pip install --constraint constraints-regression.txt dist/*.whl
      - run: python -m pip_audit --strict
      - run: cyclonedx-py environment --output-format JSON --output-file dist/sbom.cdx.json
      - name: Clean installed-wheel smoke test
        run: |
          python -m venv /tmp/envira-wheel-test
          /tmp/envira-wheel-test/bin/pip install --constraint constraints-regression.txt dist/*.whl
          cd /tmp
          /tmp/envira-wheel-test/bin/envira-pdf-layout --version
          /tmp/envira-wheel-test/bin/envira-pdf-layout resources
          /tmp/envira-wheel-test/bin/python -c 'import envira_pdf_layout, pathlib; assert "site-packages" in str(pathlib.Path(envira_pdf_layout.__file__))'
      - name: Verify tag and wheel version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/verify_release_tag.py "${GITHUB_REF_NAME}" dist/*.whl
