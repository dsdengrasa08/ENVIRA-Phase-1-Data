name: package

on:
  pull_request:
  push:
    tags: ["envira-pdf-layout-v*"]

jobs:
  wheel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf_layout_pipeline-AEE-vWiP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade build twine pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall "dist/$(find dist -name '*.whl' -printf '%f' -quit)"
      - run: envira-pdf-layout --version
      - run: pytest -q
      - run: pytest -q -m regression
      - name: Verify wheel resources
        run: envira-pdf-layout resources
