[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envira-gradio-web-app"
version = "0.1.8"
description = "Independent Gradio application for ENVIRA PDF layout detection"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{name = "ENVIRA contributors"}]
keywords = ["PDF", "document-layout", "research-software", "Docling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "envira-pdf-layout==0.1.8",
  "gradio==6.24.0",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
