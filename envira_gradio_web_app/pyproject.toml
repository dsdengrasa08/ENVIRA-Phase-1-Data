[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envira-gradio-web-app"
version = "0.1.0"
description = "Independent Gradio application for ENVIRA PDF layout detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gradio>=5,<7",
  "docling>=2,<3",
  "PyMuPDF>=1.23,<2",
  "opencv-python-headless>=4.8,<5",
  "pandas>=2,<3",
  "matplotlib>=3.7,<4",
  "tqdm>=4.66,<5",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"envira_gradio.pipeline" = ["resources/*.yaml", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
